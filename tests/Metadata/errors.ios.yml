# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/ios.json
IO_PULLDOWN:
  port: PORTJ
  pinNumber: 0
  direction: input
  pinMode: pulldown
  triggerMode: toggle
  interruptPriority: low
IO_POLLED:
  port: PORTJ
  pinNumber: 1
  direction: input
  pinMode: pullup
  triggerMode: none
  interruptPriority: low
  interruptNumber: 0