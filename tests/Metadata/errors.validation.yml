# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/registers.json
device: ValidationErrorTests
firmwareVersion: "0.1"
hardwareTargets: "1.0"
registers:
  PulseWidth:
    address: 32
    type: U16
    access: Write
    minValue: 1
  Configuration:
    address: 33
    type: U8
    length: 2
    access: Write
    payloadSpec:
      Level:
        offset: 0
        maxValue: 100
        defaultValue: 200
  TriggerMode:
    address: 34
    type: U8
    access: Write
    maskType: TriggerModes
  DeviceLabel:
    address: 35
    type: U16
    length: 8
    access: Write
    interfaceType: string
  OutputState:
    address: 36
    type: U8
    length: 2
    access: Write
    payloadSpec:
      Enabled:
        offset: 0
        length: 2
        interfaceType: bool
  Timing:
    address: 39
    type: U8
    length: 2
    access: Write
    payloadSpec:
      Period:
        offset: 0
        length: 2
        interfaceType: uint
  Color0:
    address: 37
    type: U8
    length: 3
    access: Write
    interfaceType: ColorPayload
    payloadSpec:
      Red:
        offset: 0
      Green:
        offset: 1
      Blue:
        offset: 2
  Color1:
    address: 38
    type: U8
    length: 3
    access: Write
    interfaceType: ColorPayload
    payloadSpec:
      Red:
        offset: 0
      Green:
        offset: 2
      Blue:
        offset: 1
  Window:
    address: 40
    type: U8
    length: 4
    access: Write
    interfaceType: uint
  Gain:
    address: 41
    type: U8
    access: Write
    interfaceType: int
  Calibration:
    address: 42
    type: U32
    length: 2
    access: Write
    payloadSpec:
      Scale:
        offset: 0
        interfaceType: float
  LineState:
    address: 43
    type: U8
    access: Write
    maskType: WideLines
  LineConfig:
    address: 44
    type: U8
    access: Write
    payloadSpec:
      Low:
        offset: 0
        mask: 0xF
        maskType: WideLines
  Notes:
    address: 45
    type: U8
    access: Write
    description: |
      Specifies the first paragraph.

      Specifies the second paragraph.
bitMasks:
  WideLines:
    bits:
      Line0: 0x1
      Line8: 0x100
  Channels:
    bits:
      Off: 0x0
      Channel0: 0x1
      Channel1: 0x2
      Both: 0x3
      Again: 0x2
